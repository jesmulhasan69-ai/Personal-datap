        function loadState() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) {
                    const def = getDefaultState();
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(def));
                    return def;
                }
                const parsed = JSON.parse(raw);
                const def = getDefaultState();
                // Merge safely to prevent missing keys
                return {
                    ...def,
                    ...parsed,
                    settings: { ...def.settings, ...(parsed.settings || {}) }
                };
            } catch (err) {
                console.error('Error loading state:', err);
                return getDefaultState();
            }
        }

        function formatBDT(amount) {
            const num = Number(amount) || 0;
            return '৳ ' + num.toLocaleString('en-IN', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
        }

        function escapeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const colors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-indigo-600 text-white',
                warning: 'bg-amber-500 text-white'
            };
            const icons = {
                success: 'fa-circle-check',
                error: 'fa-circle-exclamation',
                info: 'fa-circle-info',
                warning: 'fa-triangle-exclamation'
            };
            const toast = document.createElement('div');
            toast.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg text-sm font-medium fade-in ${colors[type] || colors.info}`;
            toast.innerHTML = `<i class="fa-solid ${icons[type] || icons.info}"></i><span>${escapeHTML(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s';
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function openModal(title, bodyHTML, maxWidthClass = 'max-w-lg') {
            const modal = document.getElementById('app-modal');
            const box = document.getElementById('app-modal-box');

            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-body').innerHTML = bodyHTML;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            const modal = document.getElementById('app-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

            document.getElementById('confirm-title').textContent = title;

            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeConfirmModal() {
            const modal = document.getElementById('confirm-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            confirmCallback = null;
        }

        document.getElementById('confirm-ok-btn').addEventListener('click', () => {
            if (typeof confirmCallback === 'function') confirmCallback();
            closeConfirmModal();
        });

        function openPreviewModal(title, meta, fileName, mimeType, dataUrl) {
            document.getElementById('preview-title').textContent = title || fileName;
            document.getElementById('preview-meta').textContent = meta || '';
            const dlBtn = document.getElementById('preview-download-btn');
            dlBtn.href = dataUrl;
            dlBtn.download = fileName || 'document';

            const content = document.getElementById('preview-content');
            if (mimeType && mimeType.startsWith('image/')) {
                content.innerHTML = `<img src="${dataUrl}" alt="${escapeHTML(title)}" class="max-w-full max-h-[75vh] rounded-xl shadow-md object-contain">`;
            } else if (mimeType === 'application/pdf') {
                content.innerHTML = `<iframe src="${dataUrl}" class="w-full h-[75vh] rounded-xl border border-slate-200 bg-white"></iframe>`;
            } else {
                content.innerHTML = `
                    <div class="text-center py-12 px-6">

            modal.classList.add('flex');

        function copyTextToClipboard(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        async function uploadToGoogleDrive(folderName, fileName, mimeType, dataUrl) {
            const url = (appData.settings.gasUrl || '').trim();
            if (!url) return { synced: false, driveUrl: '' };

            try {
                const base64Data = dataUrl.includes(',') ? dataUrl.split(',')[1] : dataUrl;
                const payload = JSON.stringify({
                    folderName: folderName || 'Personal Hisab',
                    fileName: fileName,
                    mimeType: mimeType || 'application/octet-stream',
                    base64Data: base64Data
                });

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: payload
                });

                if (response.ok) {
                    const result = await response.json();
                    if (result && result.status === 'success') {
                        return { synced: true, driveUrl: result.fileUrl || '' };
                    }
                }
                return { synced: false, driveUrl: '' };
            } catch (err) {
                console.warn('Google Drive upload error:', err);
                return { synced: false, driveUrl: '' };
            }
        }

                                <div onclick="switchTab('${act.tab}')" class="cursor-pointer px-5 py-3.5 hover:bg-slate-50 flex items-center justify-between gap-3 transition">
                                    <div class="min-w-0">
                                        <p class="text-sm font-medium text-slate-800 truncate">${escapeHTML(act.title)}</p>
                                        <div class="flex items-center gap-2 mt-0.5">
                                            <span class="text-[11px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">${escapeHTML(act.tag)}</span>
                                            <span class="text-[11px] text-slate-400">${escapeHTML(act.date)}</span>
                                        </div>
                                    </div>
                                    <span class="text-sm font-bold shrink-0 ${act.color}">${act.sign} ${formatBDT(act.amount)}</span>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
            `;

            // Initialize Charts
            renderDashboardCharts(totalBank, monthExpense, jaigaTotal, medTotal, Math.abs(mokul.balance), Math.abs(wife.balance));
        }

        function renderDashboardCharts(totalBank, monthExpense, jaigaTotal, medTotal, mokulBal, wifeBal) {
            if (chartInstances.expense) chartInstances.expense.destroy();
            if (chartInstances.overview) chartInstances.overview.destroy();

            // Category totals for Doughnut
            const catMap = {};
            appData.dailyExpenses.forEach(e => {
                catMap[e.category] = (catMap[e.category] || 0) + (Number(e.amount) || 0);
            });
            const labels = Object.keys(catMap);
            const values = Object.values(catMap);

            const ctx1 = document.getElementById('expenseDoughnutChart');
            if (ctx1) {
                chartInstances.expense = new Chart(ctx1, {
                    type: 'doughnut',
                    data: {
                        labels: labels.length ? labels : ['কোনো খরচ নেই'],
                        datasets: [{
                            data: values.length ? values : [1],
                            backgroundColor: values.length
                                ? ['#6366f1', '#10b981', '#f59e0b', '#ef4444', '#ec4899', '#14b8a6', '#8b5cf6']
                                : ['#e2e8f0'],
                            borderWidth: 2,
                            borderColor: '#ffffff'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 10, font: { family: 'Hind Siliguri', size: 11 } } }
                        }
                    }
                });
            }

            const ctx2 = document.getElementById('overviewBarChart');
            if (ctx2) {
                chartInstances.overview = new Chart(ctx2, {
                    type: 'bar',
                    data: {
                        labels: ['ব্যাংক', 'জায়গা', 'মাসিক খরচ', 'মেডিসিন', 'মকুল AC', 'ওয়াইফ AC'],
                        datasets: [{
                            label: 'টাকা (৳)',
                            data: [totalBank, jaigaTotal, monthExpense, medTotal, mokulBal, wifeBal],
                            backgroundColor: ['#4f46e5', '#f59e0b', '#ef4444', '#14b8a6', '#3b82f6', '#ec4899'],
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                            x: { grid: { display: false }, ticks: { font: { family: 'Hind Siliguri', size: 11 } } }
                        }
                    }
                });
            }
        }

        /* =========================================================================
           5. MODULE 2: DAILY EXPENSE (দৈনিক খরচ)
        ========================================================================= */
        function renderDailyExpense() {
            const filtered = appData.dailyExpenses.filter(e => {
                const matchMonth = !uiState.expenseMonth || (e.date || '').startsWith(uiState.expenseMonth);
                const matchCat = uiState.expenseCategory === 'ALL' || e.category === uiState.expenseCategory;
                const q = uiState.expenseSearch.trim().toLowerCase();
                const matchSearch = !q || (e.description || '').toLowerCase().includes(q) || (e.category || '').toLowerCase().includes(q);
                return matchMonth && matchCat && matchSearch;
            }).sort((a, b) => (b.date || '').localeCompare(a.date || ''));

            const totalFiltered = filtered.reduce((s, e) => s + (Number(e.amount) || 0), 0);
            const categories = appData.settings.expenseCategories || [];

            document.getElementById('main-content').innerHTML = `
                <!-- Filter & Action Header -->
                <div class="bg-white rounded-2xl p-4 sm:p-5 border border-slate-200 shadow-xs mb-5">
                    <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div>
                            <p class="text-xs text-slate-500">ফিল্টারকৃত মোট খরচ (${filtered.length} টি এন্ট্রি)</p>
                            <p class="text-2xl font-bold text-rose-600">${formatBDT(totalFiltered)}</p>

                        <div class="flex flex-wrap items-center gap-2">

                                <i class="fa-solid fa-print"></i> প্রিন্ট
                            </button>
                            <button onclick="openQuickExpenseModal()" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium flex items-center gap-1.5 shadow-sm transition">

                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">মাস নির্বাচন</label>
                            <div class="flex gap-1.5">
                                <input type="month" value="${uiState.expenseMonth}" onchange="uiState.expenseMonth=this.value; renderDailyExpense()" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                                ${uiState.expenseMonth ? `<button onclick="uiState.expenseMonth=''; renderDailyExpense()" title="সব মাস" class="px-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs">সব</button>` : ''}

                        </div>
                        <div>

                                <option value="ALL">সব ক্যাটাগরি</option>
                                ${categories.map(c => `<option value="${escapeHTML(c)}" ${uiState.expenseCategory === c ? 'selected' : ''}>${escapeHTML(c)}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-500 mb-1">খুঁজুন</label>
                            <input type="text" value="${escapeHTML(uiState.expenseSearch)}" oninput="uiState.expenseSearch=this.value; renderDailyExpense()" placeholder="বিবরণ দিয়ে খুঁজুন..." class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                </div>

                <!-- Expenses Table -->
                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">

                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500">
                                    <th class="px-4 py-3">তারিখ</th>
                                    <th class="px-4 py-3">ক্যাটাগরি</th>
                                    <th class="px-4 py-3">বিবরণ</th>
                                    <th class="px-4 py-3 text-right">পরিমাণ (৳)</th>
                                    <th class="px-4 py-3 text-center">অ্যাকশন</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                ${filtered.length === 0 ? `
                                    <tr><td colspan="5" class="px-4 py-10 text-center text-slate-400">কোনো খরচের হিসাব পাওয়া যায়নি।</td></tr>
                                ` : filtered.map(e => `
                                    <tr class="hover:bg-slate-50/70 transition">

                                            <span class="px-2.5 py-1 rounded-full text-xs font-medium bg-indigo-50 text-indigo-700">${escapeHTML(e.category)}</span>
                                        </td>

                    </div>

        function openQuickExpenseModal(editId = null) {
            const existing = editId ? appData.dailyExpenses.find(e => e.id === editId) : null;
            const categories = appData.settings.expenseCategories || ['অন্যান্য'];
            openModal(existing ? 'খরচ এডিট করুন' : 'নতুন দৈনিক খরচ যোগ করুন', `
                <form onsubmit="saveExpenseForm(event, '${editId || ''}')" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">তারিখ</label>
                            <input type="date" id="exp-date" required value="${existing ? existing.date : todayISO()}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 mb-1">ক্যাটাগরি</label>
                            <select id="exp-cat" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm bg-white focus:outline-none focus:border-indigo-500">
                                ${categories.map(c => `<option value="${escapeHTML(c)}" ${existing && existing.category === c ? 'selected' : ''}>${escapeHTML(c)}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">পরিমাণ (৳)</label>
                        <input type="number" step="0.01" min="1" id="exp-amount" required value="${existing ? existing.amount : ''}" placeholder="যেমন: 500" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">বিবরণ</label>
                        <input type="text" id="exp-desc" required value="${existing ? escapeHTML(existing.description) : ''}" placeholder="কী বাবদ খরচ হয়েছে..." class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium">বাতিল</button>
                        <button type="submit" class="px-5 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium shadow-sm">সংরক্ষণ করুন</button>
                    </div>
                </form>
            `);
        }

        function saveExpenseForm(e, editId) {
            e.preventDefault();
            const entry = {
                id: editId || generateId('exp'),
                date: document.getElementById('exp-date').value,
                category: document.getElementById('exp-cat').value,
                amount: Number(document.getElementById('exp-amount').value),
                description: document.getElementById('exp-desc').value.trim()
            };
            if (editId) {
                const idx = appData.dailyExpenses.findIndex(x => x.id === editId);
                if (idx > -1) appData.dailyExpenses[idx] = entry;
                showToast('খরচ আপডেট করা হয়েছে');
            } else {
                appData.dailyExpenses.push(entry);
                showToast('নতুন খরচ যোগ করা হয়েছে');
            }
            saveState();
            closeModal();
            renderActiveView();
        }

        function deleteExpense(id) {
            showConfirmModal('খরচ ডিলিট করুন', 'আপনি কি এই খরচের এন্ট্রিটি মুছে ফেলতে চান?', () => {
                appData.dailyExpenses = appData.dailyExpenses.filter(e => e.id !== id);
                saveState();
                showToast('খরচ ডিলিট করা হয়েছে', 'info');
                renderDailyExpense();
            });
        }

        function printDailyExpenses() {
            const filtered = appData.dailyExpenses.filter(e => {
                const matchMonth = !uiState.expenseMonth || (e.date || '').startsWith(uiState.expenseMonth);
                const matchCat = uiState.expenseCategory === 'ALL' || e.category === uiState.expenseCategory;
                return matchMonth && matchCat;
            }).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
            const total = filtered.reduce((s, e) => s + (Number(e.amount) || 0), 0);
            const rows = filtered.map(e => `
                <tr>
                    <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${escapeHTML(e.date)}</td>
                    <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${escapeHTML(e.category)}</td>
                    <td style="padding:8px; border-bottom:1px solid #e2e8f0;">${escapeHTML(e.description)}</td>
                    <td style="padding:8px; border-bottom:1px solid #e2e8f0; text-align:right; font-weight:600;">${formatBDT(e.amount)}</td>
                </tr>
            `).join('');
            printHTML(`দৈনিক খরচের রিপোর্ট (${uiState.expenseMonth || 'সকল মাস'})`, `
                <table style="width:100%; border-collapse:collapse; font-size:13px;">
                    <thead>
                        <tr style="background:#f1f5f9;">
                            <th style="padding:8px; text-align:left;">তারিখ</th>
                            <th style="padding:8px; text-align:left;">ক্যাটাগরি</th>
                            <th style="padding:8px; text-align:left;">বিবরণ</th>
                            <th style="padding:8px; text-align:right;">পরিমাণ</th>
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                    <tfoot>
                        <tr style="background:#f8fafc; font-weight:700;">
                            <td colspan="3" style="padding:10px; text-align:right;">মোট খরচ:</td>
                            <td style="padding:10px; text-align:right; color:#e11d48;">${formatBDT(total)}</td>
                        </tr>
                    </tfoot>
                </table>
            `);
        }

        function saveDocFolder(e, editId) {
            e.preventDefault();
            const name = document.getElementById('folder-name').value.trim();
            if (!name) return;
            if (editId) {
                const f = appData.docFolders.find(x => x.id === editId);
                if (f) f.name = name;
                showToast('ফোল্ডারের নাম আপডেট হয়েছে');
            } else {
                const newF = { id: generateId('fld'), name, createdAt: todayISO() };
                appData.docFolders.push(newF);
                uiState.selectedFolderId = newF.id;
                showToast('নতুন ফোল্ডার তৈরি হয়েছে');
            }
            saveState();
            closeModal();
            renderHomeDocs();
        }

        function deleteDocFolder(id) {
            const f = appData.docFolders.find(x => x.id === id);
            if (!f) return;
            showConfirmModal('ফোল্ডার ডিলিট করুন', `"${f.name}" ফোল্ডার এবং এর ভেতরের সকল ফাইল মুছে ফেলা হবে। আপনি কি নিশ্চিত?`, () => {
                appData.docFolders = appData.docFolders.filter(x => x.id !== id);
                appData.homeDocuments = appData.homeDocuments.filter(d => d.folderId !== id);
                if (uiState.selectedFolderId === id) {
                    uiState.selectedFolderId = appData.docFolders[0]?.id || null;

                saveState();

        async function handleHomeDocUpload(e, folderId) {
            e.preventDefault();
            const fileInput = document.getElementById('doc-file');
            const file = fileInput.files[0];
            if (!file) return;

            const btn = document.getElementById('doc-upload-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> প্রসেসিং হচ্ছে...`;

            try {
                const dataUrl = await readFileAsDataURL(file);
                const folder = appData.docFolders.find(f => f.id === folderId);
                const driveRes = await uploadToGoogleDrive(folder ? folder.name : 'Home Documents', file.name, file.type, dataUrl);

                appData.homeDocuments.push({
                    id: generateId('doc'),
                    folderId,
                    title: document.getElementById('doc-title').value.trim(),
                    date: document.getElementById('doc-date').value,
                    notes: document.getElementById('doc-notes').value.trim(),
                    fileName: file.name,
                    mimeType: file.type,
                    dataUrl,
                    driveUrl: driveRes.driveUrl,
                    synced: driveRes.synced
                });

                if (saveState()) {
                    showToast(driveRes.synced ? 'ফাইল লোকাল ও গুগল ড্রাইভে সেভ হয়েছে!' : 'ফাইল লোকালি সংরক্ষিত হয়েছে!', 'success');
                }
                closeModal();
                renderHomeDocs();
            } catch (err) {
                showToast('ফাইল আপলোড করতে সমস্যা হয়েছে।', 'error');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> আপলোড ও সেভ`;
            }
        }

        function previewHomeDoc(docId) {
            const doc = appData.homeDocuments.find(d => d.id === docId);
            if (!doc) return;
            openPreviewModal(doc.title, `${doc.date} • ${doc.fileName}`, doc.fileName, doc.mimeType, doc.dataUrl);
        }

        function deleteHomeDoc(docId) {
            showConfirmModal('ডকুমেন্ট ডিলিট করুন', 'আপনি কি এই ফাইলটি মুছে ফেলতে চান?', () => {

                renderHomeDocs();
            });
        }

        /* =========================================================================
           7. MODULES 4 & 7: MOKUL VAI AC & WIFE AC (Reusable Ledger Engine)

        function renderLedgerView(dataKey, title, customModId = null) {
            const entries = customModId
                ? (appData.settings.customModules.find(m => m.id === customModId)?.data || [])
                : (appData[dataKey] || []);

            const totals = computeLedgerTotals(entries);

            // Compute chronological running balance
            const sortedAsc = [...entries].sort((a, b) => (a.date || '').localeCompare(b.date || ''));
            let running = 0;
            const withBalance = sortedAsc.map(item => {
                running += item.type === 'gave' ? (Number(item.amount) || 0) : -(Number(item.amount) || 0);
                return { ...item, runningBalance: running };

            document.getElementById('main-content').innerHTML = `
                <!-- Summary Cards -->

                    <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">

                    </div>
                    <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">

                    <div class="bg-gradient-to-br from-slate-800 to-slate-900 text-white rounded-2xl p-5 shadow-md">
                        <p class="text-xs font-medium text-slate-300">বর্তমান ব্যালেন্স (Net Balance)</p>
                        <p class="text-2xl font-bold mt-1">${formatBDT(Math.abs(totals.balance))}</p>
                        <p class="text-[11px] text-emerald-300 mt-0.5">${totals.balance > 0 ? 'পাওনা আছে (দিয়েছি বেশি)' : totals.balance < 0 ? 'দিতে হবে (পেয়েছি বেশি)' : 'হিসাব সমান'}</p>
                    </div>
                </div>

                <!-- Actions Bar -->
                <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
                    <h3 class="font-bold text-slate-800 text-sm sm:text-base">লেনদেনের তালিকা (${entries.length} টি)</h3>
                    <div class="flex items-center gap-2">
                        <button onclick="printLedger('${dataKey}', '${escapeHTML(title)}', '${customModId || ''}')" class="px-3.5 py-2 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs sm:text-sm font-medium flex items-center gap-1.5 transition">
                            <i class="fa-solid fa-print"></i> স্টেটমেন্ট প্রিন্ট
                        </button>
                        <button onclick="openLedgerModal('${dataKey}', null, '${customModId || ''}')" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium flex items-center gap-1.5 shadow-sm transition">
                            <i class="fa-solid fa-plus"></i> নতুন এন্ট্রি
                        </button>
                    </div>
                </div>

                <!-- Ledger Table -->
                <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500">
                                    <th class="px-4 py-3">তারিখ</th>
                                    <th class="px-4 py-3">ধরণ</th>
                                    <th class="px-4 py-3">বিবরণ / নোট</th>

                                </tr>
                            </thead>

                                ${withBalance.length === 0 ? `
                                    <tr><td colspan="6" class="px-4 py-10 text-center text-slate-400">কোনো লেনদেন যুক্ত করা হয়নি।</td></tr>
                                ` : withBalance.map(item => `
                                    <tr class="hover:bg-slate-50/70 transition">

                </div>
            `;

        function openLedgerModal(dataKey, editId = null, customModId = '') {

        function saveLedgerEntry(e, dataKey, editId, customModId) {
            e.preventDefault();
            let list;
            if (customModId) {
                const mod = appData.settings.customModules.find(m => m.id === customModId);
                if (!mod) return;
                if (!mod.data) mod.data = [];
                list = mod.data;
            } else {
                list = appData[dataKey];
            }

            const entry = {
                id: editId || generateId('ldg'),
                date: document.getElementById('ldg-date').value,
                type: document.getElementById('ldg-type').value,
                amount: Number(document.getElementById('ldg-amount').value),
                note: document.getElementById('ldg-note').value.trim()
            };

            if (editId) {
                const idx = list.findIndex(x => x.id === editId);
                if (idx > -1) list[idx] = entry;
                showToast('লেনদেন আপডেট করা হয়েছে');
            } else {
                list.push(entry);
                showToast('নতুন লেনদেন যোগ করা হয়েছে');
            }
            saveState();
            closeModal();
            renderActiveView();
        }

        function deleteLedgerEntry(dataKey, id, customModId) {

            const entries = customModId
                ? (appData.settings.customModules.find(m => m.id === customModId)?.data || [])

            const totals = computeLedgerTotals(entries);
            const sortedAsc = [...entries].sort((a, b) => (a.date || '').localeCompare(b.date || ''));

            const rows = sortedAsc.map(item => {

                    <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs">

                    </div>

        function saveJaiga(e, editId) {
            e.preventDefault();
            const entry = {
                id: editId || generateId('jg'),
                date: document.getElementById('jg-date').value,
                type: document.getElementById('jg-type').value,
                landName: document.getElementById('jg-land').value.trim(),
                khatianDag: document.getElementById('jg-khatian').value.trim(),
                partyName: document.getElementById('jg-party').value.trim(),
                amount: Number(document.getElementById('jg-amount').value),
                note: document.getElementById('jg-note').value.trim()
            };
            if (editId) {
                const idx = appData.jaigaHisab.findIndex(x => x.id === editId);
                if (idx > -1) appData.jaigaHisab[idx] = entry;
                showToast('জায়গার হিসাব আপডেট হয়েছে');
            } else {
                appData.jaigaHisab.push(entry);
                showToast('জায়গার নতুন হিসাব যোগ হয়েছে');
            }
            saveState();
            closeModal();
            renderJaiga();
        }

                appData.jaigaHisab = appData.jaigaHisab.filter(x => x.id !== id);
                saveState();
                showToast('ডিলিট করা হয়েছে', 'info');
                renderJaiga();
            });
        }

        function saveMedicine(e, editId) {
            e.preventDefault();
            const entry = {
                id: editId || generateId('med'),
                date: document.getElementById('med-date').value,
                medicineName: document.getElementById('med-name').value.trim(),
                amount: Number(document.getElementById('med-amount').value),
                note: document.getElementById('med-note').value.trim()
            };
            if (editId) {
                const idx = appData.medicineExpenses.findIndex(x => x.id === editId);
                if (idx > -1) appData.medicineExpenses[idx] = entry;
                showToast('মেডিসিন খরচ আপডেট হয়েছে');
            } else {
                appData.medicineExpenses.push(entry);
                showToast('মেডিসিন খরচ যোগ হয়েছে');
            }
            saveState();
            closeModal();
            renderMedicine();
        }

            showConfirmModal('খরচ ডিলিট করুন', 'আপনি কি এই মেডিসিন খরচের হিসাব মুছে ফেলতে চান?', () => {
                appData.medicineExpenses = appData.medicineExpenses.filter(x => x.id !== id);
                saveState();
                showToast('ডিলিট করা হয়েছে', 'info');
                renderMedicine();
            });

        async function handlePrescriptionUpload(e) {
            e.preventDefault();
            const file = document.getElementById('pr-file').files[0];
            if (!file) return;
            const btn = document.getElementById('pr-upload-btn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> আপলোড হচ্ছে...`;

            try {
                const dataUrl = await readFileAsDataURL(file);
                const driveRes = await uploadToGoogleDrive('Prescriptions', file.name, file.type, dataUrl);
                appData.prescriptions.push({
                    id: generateId('pr'),
                    doctorName: document.getElementById('pr-doctor').value.trim(),
                    date: document.getElementById('pr-date').value,
                    hospitalNote: document.getElementById('pr-note').value.trim(),
                    fileName: file.name,
                    mimeType: file.type,
                    dataUrl,
                    driveUrl: driveRes.driveUrl,
                    synced: driveRes.synced
                });
                if (saveState()) {
                    showToast(driveRes.synced ? 'প্রেসক্রিপশন ড্রাইভে সিঙ্ক ও সেভ হয়েছে!' : 'প্রেসক্রিপশন সংরক্ষিত হয়েছে!');
                }
                closeModal();
                renderMedicine();
            } catch (err) {
                showToast('আপলোড করতে সমস্যা হয়েছে।', 'error');
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> আপলোড করুন`;
            }
        }

        function previewPrescription(id) {
            const p = appData.prescriptions.find(x => x.id === id);
            if (!p) return;
            openPreviewModal(p.doctorName, `${p.date} • ${p.hospitalNote || p.fileName}`, p.fileName, p.mimeType, p.dataUrl);

    var rootName = "Amar Personal Hisab";
    var folderName = data.folderName || "General";

    // Get or create Root folder
    var rootIter = DriveApp.getFoldersByName(rootName);
    var rootFolder = rootIter.hasNext() ? rootIter.next() : DriveApp.createFolder(rootName);

    // Get or create Subfolder (e.g., BS Khatian, RS Khatian, Dalil, Prescriptions)
    var subIter = rootFolder.getFoldersByName(folderName);
    var targetFolder = subIter.hasNext() ? subIter.next() : rootFolder.createFolder(folderName);

    // Decode Base64 and save file
    var decoded = Utilities.base64Decode(data.base64Data);
    var blob = Utilities.newBlob(decoded, data.mimeType || "application/octet-stream", data.fileName);
    var file = targetFolder.createFile(blob);

    return ContentService.createTextOutput(JSON.stringify({
      status: "success",
      fileId: file.getId(),
      fileUrl: file.getUrl()
    })).setMimeType(ContentService.MimeType.JSON);
  } catch (err) {
    return ContentService.createTextOutput(JSON.stringify({
      status: "error",
      message: err.toString()
    })).setMimeType(ContentService.MimeType.JSON);
  }
}`;

                        <li>Type হিসেবে <b>Web app</b> সিলেক্ট করুন, <b>Who has access: Anyone</b> দিয়ে Deploy করুন।</li>
                        <li>প্রাপ্ত <b>Web App URL</b> টি কপি করে এই অ্যাপের Settings প্যানেলে পেস্ট করে সেভ করুন।</li>
                    </ol>
                    <div class="relative">
                        <pre id="gas-code-block" class="bg-slate-900 text-emerald-300 p-4 rounded-xl text-xs overflow-x-auto max-h-60">${escapeHTML(scriptCode)}</pre>
                        <button onclick="copyTextToClipboard(document.getElementById('gas-code-block').textContent)" class="absolute top-2.5 right-2.5 px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold shadow">
                            <i class="fa-regular fa-copy mr-1"></i> কপি কোড
                        </button>
                    </div>
                </div>
            `, 'max-w-2xl');
        }

        function addExpenseCategory(e) {
            e.preventDefault();
            const val = document.getElementById('new-cat-input').value.trim();
            if (!val) return;
            if (!appData.settings.expenseCategories.includes(val)) {
                appData.settings.expenseCategories.push(val);
                saveState();
                showToast('নতুন ক্যাটাগরি যোগ হয়েছে');
                renderSettings();
            }
        }

        function removeExpenseCategory(idx) {
            if (appData.settings.expenseCategories.length <= 1) {
                showToast('অন্তত একটি ক্যাটাগরি থাকতে হবে।', 'warning');
                return;
            }
            appData.settings.expenseCategories.splice(idx, 1);
            saveState();
            renderSettings();
        }

        function downloadBackupJSON() {
            const blob = new Blob([JSON.stringify(appData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `amar_personal_hisab_backup_${todayISO()}.json`;
            a.click();
            URL.revokeObjectURL(url);
            showToast('ব্যাকআপ ফাইল ডাউনলোড হয়েছে!');
        }

        function restoreBackupJSON(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
                try {
                    const parsed = JSON.parse(reader.result);
                    if (!parsed || typeof parsed !== 'object' || !parsed.settings) {
                        throw new Error('Invalid format');
                    }
                    appData = { ...getDefaultState(), ...parsed };
                    saveState();
                    renderSidebar();
                    renderSettings();
                    showToast('ডাটা সফলভাবে রিস্টোর করা হয়েছে!', 'success');
                } catch (err) {
                    showToast('সঠিক ব্যাকআপ JSON ফাইল নয়!', 'error');
                }
            };
            reader.readAsText(file);
        }

        function resetDemoData() {
            showConfirmModal('ডাটা রিসেট করুন', 'সকল বর্তমান ডাটা মুছে দিয়ে প্রাথমিক ডেমো ডাটা লোড হবে। আপনি কি নিশ্চিত?', () => {
                appData = getDefaultState();
                saveState();
                activeTab = 'dashboard';
                renderSidebar();
                renderActiveView();
                showToast('ডাটা রিসেট করা হয়েছে', 'info');
            });
        }

        /* =========================================================================
           12. DYNAMIC CUSTOM MODULES RENDERER (Ledger / Expense / Documents)
        ========================================================================= */
        function renderCustomModule(modId) {
            const mod = (appData.settings.customModules || []).find(m => m.id === modId);
            if (!mod) {
                switchTab('dashboard');
                return;
            }
            if (!mod.data) mod.data = [];

            if (mod.type === 'ledger') {
                renderLedgerView('', mod.name, mod.id);
                return;
            }

            if (mod.type === 'expense') {
                const total = mod.data.reduce((s, x) => s + Number(x.amount || 0), 0);
                const sorted = [...mod.data].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                document.getElementById('main-content').innerHTML = `
                    <div class="bg-white rounded-2xl p-5 border border-slate-200 shadow-xs mb-5 flex flex-wrap items-center justify-between gap-3">
                        <div>
                            <p class="text-xs text-slate-500">মোট খরচ (${sorted.length} টি এন্ট্রি)</p>
                            <p class="text-2xl font-bold text-rose-600">${formatBDT(total)}</p>
                        </div>
                        <button onclick="openCustomExpenseModal('${mod.id}')" class="px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-medium flex items-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-plus"></i> নতুন খরচ যোগ করুন
                        </button>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-200 shadow-xs overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500">
                                        <th class="px-4 py-3">তারিখ</th>
                                        <th class="px-4 py-3">বিবরণ</th>
                                        <th class="px-4 py-3 text-right">পরিমাণ (৳)</th>
                                        <th class="px-4 py-3 text-center">অ্যাকশন</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${sorted.length === 0 ? `<tr><td colspan="4" class="px-4 py-10 text-center text-slate-400">কোনো এন্ট্রি নেই।</td></tr>` :
                                        sorted.map(item => `
                                            <tr class="hover:bg-slate-50/70">
                                                <td class="px-4 py-3 whitespace-nowrap text-slate-600 text-xs sm:text-sm">${escapeHTML(item.date)}</td>
                                                <td class="px-4 py-3 font-medium text-slate-800">${escapeHTML(item.note)}</td>
                                                <td class="px-4 py-3 whitespace-nowrap text-right font-bold text-rose-600">${formatBDT(item.amount)}</td>
                                                <td class="px-4 py-3 whitespace-nowrap text-center">
                                                    <button onclick="deleteCustomItem('${mod.id}', '${item.id}')" class="p-1.5 rounded-lg text-rose-500 hover:bg-rose-50"><i class="fa-solid fa-trash-can"></i></button>
                                                </td>
                                            </tr>
                                        `).join('')
                                    }
                                </tbody>
                            </table>
                        </div>
                    </div>
                `;
                return;
            }

            if (mod.type === 'documents') {
                const sorted = [...mod.data].sort((a, b) => (b.date || '').localeCompare(a.date || ''));
                document.getElementById('main-content').innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
                        <p class="text-sm text-slate-600">মোট সংরক্ষিত ফাইল: <b>${sorted.length} টি</b></p>
                        <button onclick="openCustomDocModal('${mod.id}')" class="px-4 py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-medium flex items-center gap-1.5 shadow-sm">
                            <i class="fa-solid fa-cloud-arrow-up"></i> ফাইল আপলোড করুন
                        </button>
                    </div>
                    ${sorted.length === 0 ? `
                        <div class="bg-white rounded-2xl border-2 border-dashed border-slate-200 p-12 text-center text-slate-400">
                            এই ভল্টে কোনো ফাইল আপলোড করা হয়নি।
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${sorted.map(doc => {
                                const isImg = (doc.mimeType || '').startsWith('image/');
                                return `
                                    <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs flex flex-col">
                                        <div onclick="previewCustomDoc('${mod.id}', '${doc.id}')" class="cursor-pointer h-40 bg-slate-100 flex items-center justify-center overflow-hidden relative">
                                            ${isImg ? `<img src="${doc.dataUrl}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-file-lines text-indigo-500 text-4xl"></i>`}
                                            <span class="absolute top-2 right-2 px-2 py-0.5 rounded-full text-[10px] font-semibold ${doc.synced ? 'bg-emerald-600 text-white' : 'bg-slate-800/80 text-white'}">
                                                ${doc.synced ? 'Drive Synced' : 'Local Saved'}
                                            </span>
                                        </div>
                                        <div class="p-3.5 flex-1 flex flex-col justify-between">
                                            <div>
                                                <h4 class="font-bold text-sm text-slate-800 truncate">${escapeHTML(doc.title)}</h4>
                                                <p class="text-[11px] text-slate-400">${escapeHTML(doc.date)}</p>
                                            </div>
                                            <div class="flex items-center justify-between mt-3 pt-2.5 border-t border-slate-100">
                                                <div class="flex items-center gap-1.5">
                                                    <button onclick="previewCustomDoc('${mod.id}', '${doc.id}')" class="px-2.5 py-1 rounded-lg bg-indigo-50 text-indigo-700 text-xs font-medium">দেখুন</button>
                                                    <a href="${doc.dataUrl}" download="${escapeHTML(doc.fileName)}" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 text-xs"><i class="fa-solid fa-download"></i></a>
                                                </div>
                                                <button onclick="deleteCustomItem('${mod.id}', '${doc.id}')" class="p-1.5 rounded-lg text-rose-500 hover:bg-rose-50"><i class="fa-solid fa-trash-can text-xs"></i></button>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                `;
            }
        }

        function openCustomExpenseModal(modId) {
            openModal('নতুন খরচ যোগ করুন', `
                <form onsubmit="saveCustomExpense(event, '${modId}')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">তারিখ</label>
                        <input type="date" id="ce-date" required value="${todayISO()}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">পরিমাণ (৳)</label>
                        <input type="number" step="0.01" min="1" id="ce-amount" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">বিবরণ</label>
                        <input type="text" id="ce-note" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm">
                    </div>
                    <div class="flex justify-end gap-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-medium">বাতিল</button>
                        <button type="submit" class="px-5 py-2 rounded-xl bg-indigo-600 text-white text-sm font-medium">সংরক্ষণ</button>
                    </div>
                </form>
            `);
        }

        function saveCustomExpense(e, modId) {
            e.preventDefault();
            const mod = appData.settings.customModules.find(m => m.id === modId);
            if (!mod) return;
            mod.data.push({
                id: generateId('ce'),
                date: document.getElementById('ce-date').value,
                amount: Number(document.getElementById('ce-amount').value),
                note: document.getElementById('ce-note').value.trim()
            });
            saveState();
            closeModal();
            showToast('খরচ সংরক্ষিত হয়েছে');
            renderCustomModule(modId);
        }

        function openCustomDocModal(modId) {
            openModal('ডকুমেন্ট আপলোড করুন', `
                <form onsubmit="saveCustomDoc(event, '${modId}')" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ফাইলের শিরোনাম</label>
                        <input type="text" id="cd-title" required class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">তারিখ</label>
                        <input type="date" id="cd-date" required value="${todayISO()}" class="w-full px-3 py-2.5 rounded-xl border border-slate-200 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">ফাইল নির্বাচন করুন</label>
                        <input type="file" id="cd-file" required accept="image/*,.pdf,.doc,.docx" class="w-full text-sm border border-slate-200 rounded-xl p-1.5">
                    </div>
                    <div class="flex justify-end gap-2">
                        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-sm font-medium">বাতিল</button>
                        <button type="submit" id="cd-btn" class="px-5 py-2 rounded-xl bg-emerald-600 text-white text-sm font-medium">আপলোড</button>
                    </div>
                </form>
            `);
        }

        async function saveCustomDoc(e, modId) {
            e.preventDefault();
            const mod = appData.settings.customModules.find(m => m.id === modId);
            const file = document.getElementById('cd-file').files[0];
            if (!mod || !file) return;
            const btn = document.getElementById('cd-btn');
            btn.disabled = true;
            btn.textContent = 'আপলোড হচ্ছে...';
            try {
                const dataUrl = await readFileAsDataURL(file);
                const driveRes = await uploadToGoogleDrive(mod.name, file.name, file.type, dataUrl);
                mod.data.push({
                    id: generateId('cd'),
                    title: document.getElementById('cd-title').value.trim(),
                    date: document.getElementById('cd-date').value,
                    fileName: file.name,
                    mimeType: file.type,
                    dataUrl,
                    driveUrl: driveRes.driveUrl,
                    synced: driveRes.synced
                });
                saveState();
                closeModal();
                showToast(driveRes.synced ? 'ফাইল গুগল ড্রাইভে সিঙ্ক হয়েছে!' : 'ফাইল সংরক্ষিত হয়েছে!');
                renderCustomModule(modId);
            } catch (err) {
                showToast('আপলোড ব্যর্থ হয়েছে', 'error');
                btn.disabled = false;
                btn.textContent = 'আপলোড';
            }
        }

        function previewCustomDoc(modId, docId) {
            const mod = appData.settings.customModules.find(m => m.id === modId);
            const doc = mod?.data?.find(d => d.id === docId);
            if (!doc) return;
            openPreviewModal(doc.title, `${doc.date} • ${doc.fileName}`, doc.fileName, doc.mimeType, doc.dataUrl);
        }

        function deleteCustomItem(modId, itemId) {
            showConfirmModal('এন্ট্রি ডিলিট করুন', 'আপনি কি এটি মুছে ফেলতে চান?', () => {
                const mod = appData.settings.customModules.find(m => m.id === modId);
                if (mod) mod.data = (mod.data || []).filter(x => x.id !== itemId);
                saveState();
                showToast('ডিলিট করা হয়েছে', 'info');
                renderCustomModule(modId);
            });
        }

        /* =========================================================================
           13. INITIALIZATION
        ========================================================================= */
        window.addEventListener('DOMContentLoaded', () => {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            document.getElementById('header-date').textContent = new Date().toLocaleDateString('bn-BD', options);
            renderSidebar();
            renderActiveView();
        });
    </script>
</body>
</html>
